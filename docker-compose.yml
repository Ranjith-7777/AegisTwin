services:
  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: AegisArena API
      ENVIRONMENT: development
      DEBUG: "false"
      API_PREFIX: /api
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      DATABASE_URL: sqlite:////data/aegistwin.db
      # Model artifacts live on the same persistent volume as the database, so
      # a recreated container never loses the files its DB records point to.
      MODEL_ARTIFACT_DIR: /data/models
      # The UI is served same-origin through nginx (below); these origins only
      # matter for a Vite dev server pointed at this backend.
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      LOG_LEVEL: INFO
      SIMULATION_ONLY: "true"
      # Local/dev convenience only: grants every request ADMIN without a real
      # sign-in. backend/app/core/config.py hard-fails at startup if this is
      # ever set with ENVIRONMENT=production, so it cannot leak into a real
      # deployment. See docs/security/AUTHENTICATION.md.
      AUTH_DEV_BYPASS_ROLE: ADMIN
    ports:
      - "8000:8000"
    volumes:
      - aegistwin-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin: nginx proxies /api and /ws to the backend.
        VITE_API_BASE_URL: ""
        VITE_WS_BASE_URL: ""
    environment:
      BACKEND_UPSTREAM: backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # nginx listens on 8080 inside the (non-root) frontend image.
      - "5173:8080"

volumes:
  aegistwin-data:

